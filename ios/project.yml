name: VueLights
options:
  bundleIdPrefix: me.renatodap
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  VueLights:
    path: .

targets:
  VueLights:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # The icon only. `App/Resources` as a whole is NOT a source path —
      # Info.plist and the entitlements live there and are consumed by the build
      # settings below; copying them in as resources would ship two conflicting
      # copies.
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: VueLights
        product: VueLightsKit
      # Embeds the widget extension into PlugIns/. Without this the extension
      # builds and is simply not in the .app, which presents as a widget that
      # never appears in the gallery — no error anywhere.
      - target: VueWidgets
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Vue Lights
        # Both reference the build settings rather than repeating their values.
        # As literals, `xcodebuild CURRENT_PROJECT_VERSION=42` silently does
        # nothing and every upload goes up as build 1 — which App Store Connect
        # accepts once and then rejects forever.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Siri needs more than one way to say the app's name. Every App Shortcut
        # phrase must contain the app name or a synonym, and "Vue" alone is
        # routinely heard as "view" — which is also why the pronunciation hints
        # are here rather than left to chance.
        #
        # An array of DICTIONARIES, not of strings. The string form looks
        # reasonable, builds, and then makes `appintentsnltrainingprocessor`
        # fail the build with "Unable to parse Info.plist" — an error that names
        # the file rather than the key, so it reads as a corrupt plist. Before
        # that tool existed the same mistake would simply have produced an app
        # Siri never answered to.
        #
        # THREE, maximum. A fourth builds, archives and uploads without
        # complaint and is then refused at INSTALL time — "has 4
        # INAlternativeAppNames in its Info.plist, maximum of 3 allowed" — so the
        # first sign of it is a TestFlight build that will not open. The app's
        # own display name does not count against the three, which is why
        # "Vue Lights" is not repeated here.
        INAlternativeAppNames:
          - INAlternativeAppName: Vue
            INAlternativeAppNamePronunciationHint: vyoo
          - INAlternativeAppName: Lights
          - INAlternativeAppName: Living Room
        # Deep links: vuelights://scene/vue_movie
        CFBundleURLTypes:
          - CFBundleURLName: me.renatodap.vuelights
            CFBundleURLSchemes: [vuelights]
    entitlements:
      path: App/Resources/VueLights.entitlements
      properties:
        # The container the app and the widget extension both open. This is not
        # a nicety: they are separate processes with separate sandboxes, so
        # without it the widget's `UserDefaults.standard` and Application Support
        # are its OWN, the scene mirror the app writes is invisible to it, and
        # the widget renders its empty state forever with nothing logged.
        #
        # This file is generated FROM here — `xcodegen generate` overwrites
        # whatever Xcode's capabilities UI wrote, so a group added in the UI and
        # not mirrored here vanishes at the next generate and the failure shows
        # up days later as an empty widget.
        com.apple.security.application-groups:
          - group.me.renatodap.vuelights
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.renatodap.vuelights
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # iPhone only. Declaring iPad while UISupportedInterfaceOrientations
        # lists portrait alone is rejected outright by App Store Connect: an iPad
        # app must support all four orientations for multitasking.
        TARGETED_DEVICE_FAMILY: "1"
        # Required because GENERATE_INFOPLIST_FILE is NO — with a hand-written
        # Info.plist Xcode does not infer the icon, and the omission surfaces at
        # upload time as a rejection rather than as a build error.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T59UJ8766W
        GENERATE_INFOPLIST_FILE: "NO"

  # The widget extension: the Home Screen widget and both Control Center
  # controls. Its own process, its own sandbox, its own memory ceiling — which is
  # why it links VueIntentsKit and VueDesignSystemKit rather than the whole app.
  VueWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Sources
    dependencies:
      - package: VueLights
        product: VueIntentsKit
      - package: VueLights
        product: VueDesignSystemKit
    info:
      path: Widgets/Resources/Info.plist
      properties:
        # Shown under the widget in the gallery and in Settings. Same name as
        # the app on purpose — two names for one thing is how you get "which of
        # these is the lights?".
        CFBundleDisplayName: Vue Lights
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          # WidgetKit extensions are still plain app extensions, not
          # ExtensionKit ones. Get this identifier wrong and the target builds,
          # embeds, and is never loaded by anything.
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Resources/VueWidgets.entitlements
      properties:
        # Must be character-for-character the app's group. A mismatch is not a
        # build error — `containerURL(forSecurityApplicationGroupIdentifier:)`
        # simply returns nil and every read falls back to this process's own
        # empty container.
        com.apple.security.application-groups:
          - group.me.renatodap.vuelights
    settings:
      base:
        # Must be a prefix-extension of the app's identifier. Anything else is
        # rejected at install time, not at build time.
        PRODUCT_BUNDLE_IDENTIFIER: me.renatodap.vuelights.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T59UJ8766W
        GENERATE_INFOPLIST_FILE: "NO"
        # The extension ships inside the app, never on its own.
        SKIP_INSTALL: "YES"
