<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 896 1200" width="896" height="1200">
  <!-- Default lamp placement. Normalized (x,y) seed lamp_placement in Postgres;
       the in-app editor is what corrects them. -->
  <image href="room-plate-dark.png" xlink:href="room-plate-dark.png" x="0" y="0" width="896" height="1200"/>
  <defs><radialGradient id="g">
    <stop offset="0%" stop-color="#ffa758" stop-opacity="0.95"/>
    <stop offset="45%" stop-color="#ffa758" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#ffa758" stop-opacity="0"/>
  </radialGradient></defs>
  <g font-family="ui-sans-serif,system-ui" font-size="21" fill="#f5f1e8" text-anchor="middle">
    <!-- light.abajour  (0.215, 0.795)  side table, near end of the sofa -->
    <circle cx="193" cy="954" r="78" fill="url(#g)"/>
    <circle cx="193" cy="954" r="12" fill="#ffa758" stroke="#14120e" stroke-width="2"/>
    <text x="193" y="1010">abajour</text>
    <!-- light.floor_lamp  (0.215, 0.445)  arc lamp head, over the sofa -->
    <circle cx="193" cy="534" r="78" fill="url(#g)"/>
    <circle cx="193" cy="534" r="12" fill="#ffa758" stroke="#14120e" stroke-width="2"/>
    <text x="193" y="590">floor</text>
    <!-- light.shelf_lamp  (0.185, 0.235)  on the ladder shelf -->
    <circle cx="166" cy="282" r="78" fill="url(#g)"/>
    <circle cx="166" cy="282" r="12" fill="#ffa758" stroke="#14120e" stroke-width="2"/>
    <text x="166" y="338">shelf</text>
    <!-- light.0x7cb94c68286a0000  (0.795, 0.435)  FAR side of the TV — entity still unnamed -->
    <circle cx="712" cy="522" r="78" fill="url(#g)"/>
    <circle cx="712" cy="522" r="12" fill="#ffa758" stroke="#14120e" stroke-width="2"/>
    <text x="712" y="578">tv lamp</text>
  </g>
</svg>
