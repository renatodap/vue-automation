alias: Candle — Shelf Lamp
description: >-
  Deep-ember flame on the shelf lamp. ~0.7 Zigbee commands/sec, ~15 minutes,
  then settles back to its place in the room's orange gradient.
mode: restart
max_exceeded: silent
initial_state: true

triggers:
  - trigger: event
    event_type: candle_start

conditions: []

actions:
  # ~650 iterations at ~1.4s each ≈ 15 minutes. The cap lives here, NOT in a
  # guard — see the header note on repeat.index.
  - repeat:
      count: 650
      sequence:
        # Stop the moment the lamp is switched off. At the wall the bulb goes
        # unavailable; from HA it goes off. Either way this must not keep
        # sending turn_on and fight the person holding the switch.
        - condition: state
          entity_id: light.shelf_lamp
          state: "on"

        # Stand down if anything else claims the lamp. Checked as a BAND, not
        # a ceiling: a scene can land on either side of the flame range, and
        # a one-sided test only catches half of them. The loop's own hues
        # (12-19) sit inside 8-23, so it can never evict itself.
        # `is not none` matters: a scene that switches the bulb to colour
        # temperature clears hs_color entirely, and a bare default would read
        # as "still a flame" and keep the loop running against it.
        - condition: template
          value_template: "{% set h = state_attr('light.shelf_lamp','hs_color') %}{{ h is not none and 8 <= (h[0]|float(99)) <= 23 }}"

        # NOT uniform. A flame sits near its top most of the time and dips
        # occasionally. Uniform random across the whole band is constant
        # agitation at every amplitude, which reads as a failing bulb rather
        # than a flame — it is the single biggest tell.
        #   68%  steady, barely moving    16-20
        #   25%  a visible dip            12-15
        #    7%  a deep gutter             9-11
        # Floor is 9, not 7: below that the ZL1 is near its usable minimum
        # and a gutter reads as the lamp cutting out.
        - variables:
            level: "{% set roll = range(1,101)|random %}{% if roll <= 68 %}{{ range(16,21)|random }}{% elif roll <= 93 %}{{ range(12,16)|random }}{% else %}{{ range(9,12)|random }}{% endif %}"

        - action: light.turn_on
          target:
            entity_id: light.shelf_lamp
          data:
            brightness_pct: "{{ level|int }}"

            # Colour tracks brightness instead of wandering independently: a
            # flame goes deeper red as it drops and opens up as it recovers.
            # Rolling hue separately is colour noise, and it looks like an RGB
            # bulb doing a trick rather than something burning.
            #   level  9 →  hue 12.0, sat 99.0   (deep ember)
            #   level 20 →  hue 19.0, sat 93.0   (open flame)
            hs_color:
              - "{{ (12 + (level|int - 9) * 0.636)|round(1) }}"
              - "{{ (99 - (level|int - 9) * 0.545)|round(1) }}"

            # Guttering is ASYMMETRIC — a flame drops fast and recovers
            # slowly. Deep dips snap in a third of a second; everything else
            # eases over a second or more. This asymmetry is most of what
            # sells it; a symmetric fade reads as a dimmer being swept.
            transition: "{{ 0.3 if level|int < 12 else (range(10,17)|random) / 10 }}"

        - delay:
            milliseconds: "{{ range(900,1900)|random }}"

  # Only reached if all 650 iterations ran — a failed guard above stops the
  # script outright, so this cannot fire after someone has taken the lamp.
  - action: light.turn_on
    target:
      entity_id: light.shelf_lamp
    data:
      brightness_pct: 15
      hs_color: [15.9, 94.5]
      transition: 4

